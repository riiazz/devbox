[package]
name = "supervisor"
version = "0.1.0"
edition = "2024"

[dependencies]
config = { path = "../config" }
runtime = { path = "../runtime" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Console", "Win32_Foundation"] }
